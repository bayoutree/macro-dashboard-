<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宏观经济看板 | Macro Economy Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260924f">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dash-bg': '#0a1628',
            'dash-card': '#111827',
            'dash-border': '#1e2d3d',
            'dash-accent': '#3b82f6',
            'dash-green': '#10b981',
            'dash-red': '#ef4444',
            'dash-yellow': '#f59e0b',
          },
          fontFamily: {
            'sans': ['Inter', 'system-ui', 'sans-serif'],
            'mono': ['JetBrains Mono', 'monospace'],
          },
        }
      }
    }
  </script>
</head>
<body class="bg-dash-bg text-gray-200 font-sans min-h-screen">

  <header class="sticky top-0 z-50 bg-dash-bg/95 backdrop-blur border-b border-dash-border">
    <div class="max-w-[1920px] mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <h1 class="text-2xl font-bold text-white tracking-tight">📊 宏观经济看板</h1>
        <span class="text-xs text-gray-500 font-mono" id="update-time">加载中...</span>
      </div>
      <div class="flex items-center gap-3">
        <div id="data-status" class="text-xs text-gray-500"></div>
        <button id="refresh-btn" class="px-4 py-2 bg-dash-accent hover:bg-blue-600 text-white rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          刷新
        </button>
      </div>
    </div>
    <div class="max-w-[1920px] mx-auto px-6 flex gap-1 -mb-px">
      <button class="tab-btn active" data-tab="china">🇨🇳 中国宏观</button>
      <button class="tab-btn" data-tab="us">🇺🇸 美国宏观</button>
      <button class="tab-btn" data-tab="skeleton">📊 骨架图</button>
    </div>
  </header>

  <main class="max-w-[1920px] mx-auto px-6 py-6">

    <!-- Tab 1: 中国宏观（含中美联动） -->
    <div id="tab-china" class="tab-content active">
      <div id="china-groups"></div>
    </div>

    <!-- Tab 2: 美国宏观 -->
    <div id="tab-us" class="tab-content">
      <div id="us-groups"></div>
    </div>

    <!-- Tab 3: 骨架图 -->
    <div id="tab-skeleton" class="tab-content">
      <div class="bg-dash-card rounded-xl p-6 border border-dash-border">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold text-white">经济骨架 DAG</h2>
          <div class="flex gap-2">
            <button class="skel-view-btn active" data-view="china">🇨🇳 中国</button>
            <button class="skel-view-btn" data-view="us">🇺🇸 美国</button>
            <button class="skel-view-btn" data-view="cross">🌐 联动</button>
          </div>
        </div>
        <div class="flex gap-4">
          <div id="skeleton-network" class="flex-1 h-[600px] bg-dash-bg/50 rounded-lg border border-dash-border"></div>
          <div id="skeleton-detail" class="w-[380px] shrink-0 bg-dash-bg/50 rounded-lg border border-dash-border p-5 overflow-y-auto max-h-[600px]">
            <p class="text-gray-500 text-sm text-center mt-8">点击左侧节点查看详情</p>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script src="js/skeleton.js"></script>
  <script src="js/data_render.js?v=20260924f"></script>
  <script src="js/app.js"></script>
</body>
</html>
