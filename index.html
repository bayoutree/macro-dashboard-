<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宏观经济指标看板 | Macro Dashboard V2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/style_v2.css">
  <link rel="stylesheet" href="css/cycle_v3.css?v=20260918a">
  <link rel="stylesheet" href="css/cycle_v4.css?v=20260918a">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-primary': '#0a1628',
            'bg-card': '#111827',
            'bg-card-hover': '#1a2332',
            'border-subtle': '#1e293b',
            'text-primary': '#e2e8f0',
            'text-secondary': '#94a3b8',
            'text-muted': '#64748b',
            'accent-green': '#10b981',
            'accent-red': '#ef4444',
            'accent-amber': '#f59e0b',
            'accent-blue': '#3b82f6',
            'accent-purple': '#8b5cf6',
            'accent-cyan': '#06b6d4',
          },
          fontFamily: {
            'sans': ['Inter', 'system-ui', 'sans-serif'],
            'mono': ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-bg-primary text-text-primary font-sans min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-bg-primary/95 backdrop-blur-md border-b border-border-subtle">
    <div class="max-w-[1920px] mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-14">
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2">
            <span class="text-xl">📊</span>
            <h1 class="text-lg font-bold text-text-primary tracking-tight">宏观经济指标看板</h1>
          </div>
          <span class="text-xs text-text-muted hidden sm:inline">Macro Dashboard V2</span>
        </div>
        <div class="flex items-center gap-4">
          <span id="update-time" class="text-xs text-text-muted font-mono"></span>
          <button id="refresh-btn" onclick="app.refresh()" class="p-1.5 rounded-lg hover:bg-white/5 transition-colors group" title="刷新数据">
            <svg class="w-4 h-4 text-text-muted group-hover:text-text-primary transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Tab Navigation -->
  <nav class="sticky top-14 z-40 bg-bg-primary/95 backdrop-blur-md border-b border-border-subtle">
    <div class="max-w-[1920px] mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex gap-1 py-2 overflow-x-auto scrollbar-hide">
        <button class="tab-btn active" data-tab="macro" onclick="app.switchTab('macro')">
          <span class="mr-1.5">🌏</span>中美宏观
        </button>
        <button class="tab-btn" data-tab="cycle" onclick="app.switchTab('cycle')">
          <span class="mr-1.5">🌐</span>全球周期
        </button>
        <button class="tab-btn" data-tab="stock" onclick="app.switchTab('stock')"><span class="mr-1.5">📈</span>股票看板</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-[1920px] mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- Macro Tab (New 5-layer CN+US Dashboard) -->
    <div id="tab-macro" class="tab-content active">
      <iframe id="macro-iframe" src="macro-econ-dashboard/index.html" style="width:100%;height:calc(100vh - 140px);border:none;border-radius:8px;" title="中美宏观五层看板"></iframe>
    </div>

    <!-- Cycle Tab -->
    <div id="tab-cycle" class="tab-content hidden">
      <div id="cycle-content"></div>
    </div>

    <!-- Stock Tab -->
    <div id="tab-stock" class="tab-content hidden"><iframe id="stock-iframe" src="stock_dashboard.html?v=20260918a" data-src="stock_dashboard.html?v=20260918a" style="width:100%;min-height:calc(100vh - 160px);border:none;border-radius:8px;" title="股票看板"></iframe></div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-border-subtle py-4 mt-8">
    <div class="max-w-[1920px] mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-text-muted">
      <p>数据仅供参考，不构成投资建议 · 数据来源：FRED、AKShare、World Gold Council</p>
    </div>
  </footer>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-bg-primary/90 flex items-center justify-center z-[100]">
    <div class="text-center">
      <div class="inline-flex items-center gap-2 mb-3">
        <div class="w-2 h-2 bg-accent-blue rounded-full animate-pulse"></div>
        <div class="w-2 h-2 bg-accent-purple rounded-full animate-pulse" style="animation-delay:0.2s"></div>
        <div class="w-2 h-2 bg-accent-cyan rounded-full animate-pulse" style="animation-delay:0.4s"></div>
      </div>
      <p class="text-sm text-text-secondary">加载数据中...</p>
    </div>
  </div>

  <script src="js/app.js?v=20260918a"></script>
  <script src="js/cycle_v3.js?v=20260919a"></script>
  <script src="js/cycle_v4_patch.js?v=20260918a"></script>
  <script src="js/data_normalize.js?v=20260918a"></script>
  <script src="js/app_v2_patch.js?v=20260918a"></script>
  <script src="js/timing_v2.js?v=20260919a"></script>

  <!-- iframe auto-resize listener -->
  <script>
  (function() {
    var macroIframe = document.getElementById('macro-iframe');
    if (!macroIframe) return;
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'macro-resize' && e.data.height > 0) {
        macroIframe.style.height = e.data.height + 'px';
      }
    });
    // Also handle tab switch: re-show iframe when macro tab is active
    var origSwitch = window.app && window.app.switchTab;
    if (origSwitch) {
      window.app.switchTab = function(tab) {
        origSwitch.call(window.app, tab);
        if (tab === 'macro') {
          setTimeout(function() {
            try {
              var h = macroIframe.contentDocument.documentElement.scrollHeight;
              if (h > 0) macroIframe.style.height = h + 'px';
            } catch(e) {}
          }, 500);
        }
      };
    }
  })();
  </script>

</body>
</html>
