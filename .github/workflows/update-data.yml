# ============================================================
# 宏观看板 - 每日自动数据更新
# ============================================================
# 功能:
#   1. 计算六维择时评分 (timing_scores.json)
#   2. 更新中国/美国宏观数据
#   3. 更新全球资产价格
#   4. 更新资产估值
#   5. 生成看板综合结论
#
# 调度:
#   - 工作日 UTC 10:00 (北京时间 18:00) 自动执行
#   - 支持手动触发 (workflow_dispatch)
#
# 入库策略（2026-10-03 主人拍板）：先 commit/push 入库，再跑 freshness 门禁（非阻断），
# BLOCK 开 GitHub issue 告警；门禁逻辑与严格度不变。
#
# 前置条件:
#   - 在 GitHub repo Settings > Secrets 中设置:
#     - FRED_API_KEY: FRED API 密钥 (https://fred.stlouisfed.org/docs/api/api_key.html)
# ============================================================

name: Daily Data Update

on:
  schedule:
    # UTC 10:00 = 北京时间 18:00, 周一到周五
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式 (full=完整更新, timing=仅择时评分, dry-run=连通性检查)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - timing
          - dry-run

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      # ----------------------------------------------------------
      # 1. 代码检出
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史, 便于计算分位

      # ----------------------------------------------------------
      # 2. Python 环境
      # ----------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      # ----------------------------------------------------------
      # 3. 安装依赖
      # ----------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          # 额外确保关键包
          pip install akshare requests pandas numpy openpyxl

      # ----------------------------------------------------------
      # 4. 运行数据更新
      # ----------------------------------------------------------
      - name: Run data update (full)
        if: github.event.inputs.mode == '' || github.event.inputs.mode == 'full'
        run: python scripts/update_data.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONUNBUFFERED: '1'

      - name: Run data update (timing only)
        if: github.event.inputs.mode == 'timing'
        run: python scripts/update_data.py --timing
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONUNBUFFERED: '1'

      - name: Run data update (dry-run)
        if: github.event.inputs.mode == 'dry-run'
        run: python scripts/update_data.py --dry-run
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONUNBUFFERED: '1'

      # ----------------------------------------------------------
      # 4b. 回填 timing_scores.json 真实 history（防止重建清空）
      # ----------------------------------------------------------
      - name: Backfill verified timing_scores history
        if: github.event.inputs.mode == '' || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'timing'
        run: python scripts/sync_timing_scores_history.py

      # ----------------------------------------------------------
      # 5b. 同步数据到 frontend/data/ (兼容旧版前端)
      # ----------------------------------------------------------
      - name: Sync data to frontend/data
        run: |
          cp data/*.json frontend/data/ 2>/dev/null || true
          echo "✅ Data synced to frontend/data/"

      # ---- 0) 删史防线（入库前，阻断）：历史序列点数只增不减 ----
      # 与 freshness 门禁互补：本步只判历史点数单调性，覆盖全部数据 JSON，
      # 不判 GAP/STALE，因此可安全前置阻断；发现删史则本 workflow 失败、不提交。
      - name: History deletion guard (pre-commit)
        run: python scripts/history_guard.py --baseline-ref HEAD

      # ----------------------------------------------------------
      # 5. commit/push 数据变更（先入库）
      # ----------------------------------------------------------
      - name: Commit and push data changes
        id: commit
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          python scripts/ssot_check.py --fix
          python scripts/ssot_check.py
          git add data/ frontend/data/

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "📋 数据无变更, 跳过提交"
          else
            DATE=$(date +%Y-%m-%d)
            TIME=$(date +%H:%M)
            CHANGED_FILES=$(git diff --cached --name-only | wc -l)
            echo "📊 变更文件数: ${CHANGED_FILES}"
            git diff --cached --stat
            git commit -m "📊 自动数据更新 ${DATE} ${TIME} CST" \
                        -m "更新文件: $(git diff --cached --name-only | tr '\n' ', ')" \
                        -m "运行环境: GitHub Actions"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "✅ 数据已推送入库"
          fi

      # ----------------------------------------------------------
      # 6. freshness 门禁（非阻断，入库后再跑；dry-run 不评估）
      # ----------------------------------------------------------
      - name: Run freshness gate (non-blocking)
        id: gate
        if: github.event.inputs.mode == '' || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'timing'
        run: |
          set +e
          python scripts/freshness_gate.py --baseline-git 2>&1 | tee /tmp/gate.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -eq 0 ] && echo "::notice::freshness 门禁通过" \
                         || echo "::warning::freshness 门禁有 BLOCK（数据已正常入库）"
          exit 0

      # ----------------------------------------------------------
      # 7. BLOCK 开 issue 告警（去重）
      # ----------------------------------------------------------
      - name: Open BLOCK alert issue
        if: (github.event.inputs.mode == '' || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'timing') && steps.gate.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          TITLE="[freshness-block] $TODAY 数据新鲜度门禁 BLOCK"
          {
            echo "## 🚫 Freshness 门禁 BLOCK（数据已正常入库）"
            echo ""
            echo "**评估日 (UTC)**：$TODAY"
            echo "**来源 workflow**：Daily Data Update (update-data)"
            echo ""
            echo '```'
            grep -E '🚫|BLOCK|FAIL：' /tmp/gate.log | sed 's/\x1b\[[0-9;]*m//g'
            echo '```'
          } > /tmp/block_body.md
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$GITHUB_REPOSITORY" \
              --body "update-data 流水线再次确认 BLOCK（$TODAY），详见本次 run 日志。"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/block_body.md
          fi
