name: Update Macro Econ Dashboard

on:
  schedule:
    - cron: '0 8 * * *'   # UTC 08:00 = 北京时间 16:00
  workflow_dispatch:       # 支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r macro-econ-dashboard/requirements.txt

      - name: Run data scripts
        working-directory: macro-econ-dashboard
        run: python scripts/update.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit data
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add macro-econ-dashboard/data/
          git diff --cached --quiet || git commit -m "📊 Macro econ daily update $(date +%Y-%m-%d)"
          git push
