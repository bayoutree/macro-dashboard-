<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宏观经济指标看板 | Macro Dashboard V2</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ========== Base Styles ========== */
* {
  box-sizing: border-box;
}

body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: #334155;
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: #475569;
}

.scrollbar-hide {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.scrollbar-hide::-webkit-scrollbar {
  display: none;
}

/* ========== Tab Buttons ========== */
.tab-btn {
  display: inline-flex;
  align-items: center;
  padding: 8px 18px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  color: #94a3b8;
  background: transparent;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  user-select: none;
}

.tab-btn:hover {
  color: #e2e8f0;
  background: rgba(255, 255, 255, 0.04);
}

.tab-btn.active {
  color: #e2e8f0;
  background: rgba(59, 130, 246, 0.1);
  border-color: rgba(59, 130, 246, 0.3);
  box-shadow: 0 0 12px rgba(59, 130, 246, 0.1);
}

/* ========== Tab Content ========== */
.tab-content {
  display: none;
  animation: fadeIn 0.3s ease;
}
.tab-content.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== Section Title ========== */
.section-header {
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.08);
}

.section-title {
  font-size: 18px;
  font-weight: 700;
  color: #e2e8f0;
  letter-spacing: -0.02em;
}

.section-desc {
  font-size: 13px;
  color: #64748b;
  margin-top: 4px;
}

/* ========== Indicator Card ========== */
.indicator-card {
  background: #111827;
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 20px;
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  overflow: hidden;
}

.indicator-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.3), transparent);
  opacity: 0;
  transition: opacity 0.25s ease;
}

.indicator-card:hover {
  border-color: #334155;
  background: #1a2332;
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.indicator-card:hover::before {
  opacity: 1;
}

/* Card Header */
.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.card-title {
  font-size: 14px;
  font-weight: 600;
  color: #e2e8f0;
  line-height: 1.3;
}

.card-date {
  font-size: 11px;
  color: #64748b;
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
}

/* Card Value */
.card-value-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.card-value {
  font-size: 28px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: -0.03em;
  line-height: 1;
}

.card-unit {
  font-size: 13px;
  color: #64748b;
  font-weight: 400;
}

.card-change {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 13px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  padding: 2px 8px;
  border-radius: 6px;
}

.change-up {
  color: #10b981;
  background: rgba(16, 185, 129, 0.1);
}

.change-down {
  color: #ef4444;
  background: rgba(239, 68, 68, 0.1);
}

.change-neutral {
  color: #94a3b8;
  background: rgba(148, 163, 184, 0.08);
}

/* Time Range Buttons */
.time-range-btns {
  display: flex;
  gap: 4px;
}

.time-range-btn {
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 500;
  color: #64748b;
  background: transparent;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s ease;
}

.time-range-btn:hover {
  color: #94a3b8;
  background: rgba(255, 255, 255, 0.04);
}

.time-range-btn.active {
  color: #e2e8f0;
  background: rgba(59, 130, 246, 0.12);
  border-color: rgba(59, 130, 246, 0.25);
}

/* Chart Container */
.card-chart {
  width: 100%;
  height: 120px;
}

/* Asset Impact Row */
.asset-impact {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid rgba(148, 163, 184, 0.06);
}

.asset-impact-label {
  font-size: 11px;
  color: #64748b;
  margin-right: 4px;
}

.asset-impact-item {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.03);
}

.asset-impact-item .impact-arrow {
  font-size: 10px;
  font-weight: 700;
}

.impact-positive { color: #10b981; }
.impact-negative { color: #ef4444; }
.impact-neutral { color: #94a3b8; }

/* Signal Interpretation */
.signal-box {
  background: rgba(59, 130, 246, 0.04);
  border: 1px solid rgba(59, 130, 246, 0.08);
  border-radius: 8px;
  padding: 10px 12px;
}

.signal-label {
  font-size: 11px;
  font-weight: 600;
  color: #60a5fa;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.signal-text {
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.6;
}

/* ========== Investment Advice Banner ========== */
.advice-banner {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}

@media (max-width: 1024px) {
  .advice-banner {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 640px) {
  .advice-banner {
    grid-template-columns: repeat(2, 1fr);
  }
}

.advice-card {
  background: #111827;
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  transition: all 0.2s ease;
}

.advice-card:hover {
  border-color: #334155;
  transform: translateY(-1px);
}

.advice-icon {
  font-size: 24px;
  margin-bottom: 6px;
}

.advice-asset-name {
  font-size: 13px;
  font-weight: 600;
  color: #e2e8f0;
  margin-bottom: 6px;
}

.advice-signal {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 6px;
}

.signal-bullish {
  color: #10b981;
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.2);
}

.signal-bearish {
  color: #ef4444;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
}

.signal-neutral {
  color: #94a3b8;
  background: rgba(148, 163, 184, 0.08);
  border: 1px solid rgba(148, 163, 184, 0.15);
}

.signal-neutral-bullish {
  color: #10b981;
  background: rgba(16, 185, 129, 0.06);
  border: 1px solid rgba(16, 185, 129, 0.15);
}

.signal-neutral-bearish {
  color: #f59e0b;
  background: rgba(245, 158, 11, 0.08);
  border: 1px solid rgba(245, 158, 11, 0.15);
}

.advice-detail {
  font-size: 11px;
  color: #64748b;
  line-height: 1.4;
}

/* ========== Cycle Cards ========== */
.cycle-card {
  background: #111827;
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 24px;
  transition: all 0.25s ease;
}

.cycle-card:hover {
  border-color: #334155;
}

.cycle-phase {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.cycle-phase-bullish { color: #10b981; }
.cycle-phase-bearish { color: #ef4444; }
.cycle-phase-neutral { color: #f59e0b; }

.cycle-evidence {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 12px;
}

.evidence-item {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.5;
}

.evidence-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #3b82f6;
  margin-top: 6px;
  flex-shrink: 0;
}

/* ========== Valuation / Allocation Cards ========== */
.val-card {
  background: #111827;
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 20px;
}

.val-metric {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.val-value {
  font-size: 24px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: -0.02em;
}

.val-label {
  font-size: 12px;
  color: #64748b;
}

.val-percentile {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 6px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}

.pctl-high {
  color: #ef4444;
  background: rgba(239, 68, 68, 0.1);
}

.pctl-mid {
  color: #f59e0b;
  background: rgba(245, 158, 11, 0.1);
}

.pctl-low {
  color: #10b981;
  background: rgba(16, 185, 129, 0.1);
}

/* ========== Grid Layouts ========== */
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

@media (max-width: 1024px) {
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 640px) {
  .grid-3 { grid-template-columns: 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
}

/* ========== Timeline ========== */
.timeline {
  position: relative;
  padding-left: 24px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 4px;
  bottom: 4px;
  width: 2px;
  background: linear-gradient(to bottom, #3b82f6, #8b5cf6, #06b6d4);
  border-radius: 1px;
}

.timeline-item {
  position: relative;
  padding: 8px 0;
}

.timeline-dot {
  position: absolute;
  left: -20px;
  top: 14px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid #3b82f6;
  background: #0a1628;
}

.timeline-dot.active {
  background: #3b82f6;
  box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
}

/* ========== Allocation Recommendation ========== */
.alloc-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
}

.alloc-overweight {
  color: #10b981;
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.2);
}

.alloc-market {
  color: #f59e0b;
  background: rgba(245, 158, 11, 0.08);
  border: 1px solid rgba(245, 158, 11, 0.15);
}

.alloc-underweight {
  color: #ef4444;
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.15);
}

/* ========== Risk Items ========== */
.risk-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(239, 68, 68, 0.03);
  border: 1px solid rgba(239, 68, 68, 0.08);
  border-radius: 8px;
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.5;
}

.risk-icon {
  color: #ef4444;
  font-size: 14px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* ========== Data Source Link ========== */
.source-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: #64748b;
  text-decoration: none;
  transition: color 0.15s;
  margin-top: auto;
}

.source-link:hover {
  color: #94a3b8;
}

/* ========== Null/Loading State ========== */
.no-data {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #475569;
  font-size: 13px;
  font-style: italic;
}

/* ========== Konbō Phase Big Display ========== */
.kongbo-big {
  text-align: center;
  padding: 32px;
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(139, 92, 246, 0.05));
  border-radius: 16px;
  border: 1px solid rgba(59, 130, 246, 0.1);
}

.kongbo-phase {
  font-size: 24px;
  font-weight: 800;
  background: linear-gradient(135deg, #60a5fa, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.kongbo-confidence {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 12px;
  background: rgba(245, 158, 11, 0.1);
  color: #f59e0b;
}

/* ========== Resonance Summary ========== */
.resonance-card {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.04), rgba(59, 130, 246, 0.04));
  border: 1px solid rgba(16, 185, 129, 0.1);
  border-radius: 12px;
  padding: 20px;
}

/* ========== Multi-asset Chart ========== */
.multi-asset-chart {
  height: 300px;
  width: 100%;
}

/* ========== Loading animation ========== */
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.animate-pulse {
  animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}

/* ========== Refresh spin ========== */
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.refreshing svg {
  animation: spin 1s linear infinite;
}

/* ========== Cycle V2 Styles ========== */
/* Deep dark theme financial dashboard */

/* ========== Section Containers ========== */
.cycle-section {
  margin-bottom: 32px;
  padding: 24px;
  background: #111827;
  border: 1px solid #1e293b;
  border-radius: 16px;
  transition: border-color 0.25s ease;
}

.cycle-section:hover {
  border-color: #334155;
}

.cycle-section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.08);
}

.cycle-section-title .section-icon {
  font-size: 20px;
}

.cycle-section-title h2 {
  font-size: 18px;
  font-weight: 700;
  color: #e2e8f0;
  letter-spacing: -0.02em;
}

.cycle-section-title .section-desc {
  font-size: 13px;
  color: #64748b;
  margin-left: auto;
}

/* ========== Section 0: Overview Grid ========== */
.cycle-overview-grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 10px;
}

@media (max-width: 1400px) {
  .cycle-overview-grid {
    grid-template-columns: repeat(5, 1fr);
  }
}

@media (max-width: 768px) {
  .cycle-overview-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 480px) {
  .cycle-overview-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.cycle-overview-card {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 14px;
  text-align: center;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}

.cycle-overview-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  border-radius: 2px 2px 0 0;
}

.cycle-overview-card.signal-bullish::before {
  background: #10b981;
}

.cycle-overview-card.signal-bearish::before {
  background: #ef4444;
}

.cycle-overview-card.signal-neutral::before {
  background: #f59e0b;
}

.cycle-overview-card:hover {
  border-color: #334155;
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
}

.cycle-overview-card .cycle-name {
  font-size: 11px;
  font-weight: 600;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}

.cycle-overview-card .cycle-position {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
  line-height: 1.2;
}

.cycle-overview-card .cycle-signal {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
}

.cycle-overview-card .cycle-signal.bullish {
  color: #10b981;
  background: rgba(16, 185, 129, 0.1);
}

.cycle-overview-card .cycle-signal.bearish {
  color: #ef4444;
  background: rgba(239, 68, 68, 0.1);
}

.cycle-overview-card .cycle-signal.neutral {
  color: #f59e0b;
  background: rgba(245, 158, 11, 0.1);
}

/* ========== Section 1: Timeline ========== */
.cycle-timeline-container {
  width: 100%;
  height: 400px;
  position: relative;
}

/* ========== Indicator Grid & Cards ========== */
.cycle-indicator-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 20px;
}

.cycle-indicator-grid.grid-2 {
  grid-template-columns: repeat(2, 1fr);
}

.cycle-indicator-grid.grid-4 {
  grid-template-columns: repeat(4, 1fr);
}

@media (max-width: 1024px) {
  .cycle-indicator-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .cycle-indicator-grid.grid-4 {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 640px) {
  .cycle-indicator-grid {
    grid-template-columns: 1fr;
  }
}

.cycle-indicator-card {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 16px;
  transition: border-color 0.2s ease;
}

.cycle-indicator-card:hover {
  border-color: #334155;
}

.cycle-indicator-card .indicator-title {
  font-size: 12px;
  font-weight: 600;
  color: #94a3b8;
  margin-bottom: 8px;
}

.cycle-indicator-card .indicator-chart {
  width: 100%;
  height: 160px;
}

.cycle-indicator-card .indicator-chart.tall {
  height: 200px;
}

/* ========== Advice Box ========== */
.cycle-advice-box {
  background: rgba(59, 130, 246, 0.04);
  border: 1px solid rgba(59, 130, 246, 0.1);
  border-radius: 12px;
  padding: 16px 20px;
  margin-top: 16px;
}

.cycle-advice-box .advice-title {
  font-size: 13px;
  font-weight: 700;
  color: #60a5fa;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.cycle-advice-box .advice-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.cycle-advice-box .advice-list li {
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.6;
  padding-left: 14px;
  position: relative;
}

.cycle-advice-box .advice-list li::before {
  content: '•';
  position: absolute;
  left: 0;
  color: #3b82f6;
  font-weight: 700;
}

/* ========== Position Gauge ========== */
.cycle-position-gauge {
  width: 100%;
  height: 200px;
}

/* ========== Dual Region Layout ========== */
.cycle-dual-region {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

@media (max-width: 768px) {
  .cycle-dual-region {
    grid-template-columns: 1fr;
  }
}

.cycle-region-card {
  background: rgba(15, 23, 42, 0.4);
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 20px;
}

.cycle-region-card .region-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

.cycle-region-card .region-flag {
  font-size: 20px;
}

.cycle-region-card .region-title {
  font-size: 15px;
  font-weight: 700;
  color: #e2e8f0;
}

.cycle-region-card .region-phase {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}

.cycle-region-card .region-meta {
  font-size: 12px;
  color: #64748b;
  margin-bottom: 12px;
}

/* ========== Merrill Quadrant ========== */
.merrill-quadrant {
  width: 100%;
  height: 300px;
  position: relative;
}

/* ========== Kitchin Wheel ========== */
.kitchin-wheel {
  width: 100%;
  height: 260px;
  position: relative;
}

/* ========== Credit Pulse Banner ========== */
.credit-pulse-banner {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(239, 68, 68, 0.06));
  border: 1px solid rgba(245, 158, 11, 0.2);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.credit-pulse-banner .banner-icon {
  font-size: 24px;
  flex-shrink: 0;
}

.credit-pulse-banner .banner-content {
  flex: 1;
}

.credit-pulse-banner .banner-title {
  font-size: 14px;
  font-weight: 700;
  color: #f59e0b;
  margin-bottom: 4px;
}

.credit-pulse-banner .banner-text {
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.6;
}

/* ========== Triple Region (Credit) ========== */
.cycle-triple-region {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

@media (max-width: 1024px) {
  .cycle-triple-region {
    grid-template-columns: 1fr;
  }
}

/* ========== Asset View Cards (Synthesis) ========== */
.cycle-asset-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

@media (max-width: 1200px) {
  .cycle-asset-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 768px) {
  .cycle-asset-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.asset-view-card {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}

.asset-view-card::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
}

.asset-view-card.overweight::after {
  background: #10b981;
}

.asset-view-card.market-weight::after {
  background: #f59e0b;
}

.asset-view-card.underweight::after {
  background: #ef4444;
}

.asset-view-card:hover {
  border-color: #334155;
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
}

.asset-view-card .asset-icon {
  font-size: 28px;
  margin-bottom: 8px;
}

.asset-view-card .asset-name {
  font-size: 13px;
  font-weight: 600;
  color: #e2e8f0;
  margin-bottom: 8px;
}

.asset-view-card .asset-allocation {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 8px;
}

.asset-view-card .asset-allocation.overweight {
  color: #10b981;
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.2);
}

.asset-view-card .asset-allocation.market-weight {
  color: #f59e0b;
  background: rgba(245, 158, 11, 0.08);
  border: 1px solid rgba(245, 158, 11, 0.15);
}

.asset-view-card .asset-allocation.underweight {
  color: #ef4444;
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.15);
}

.asset-view-card .asset-reason {
  font-size: 11px;
  color: #64748b;
  line-height: 1.5;
  text-align: left;
}

/* ========== Kongbo Specific ========== */
.kongbo-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

@media (max-width: 768px) {
  .kongbo-layout {
    grid-template-columns: 1fr;
  }
}

.kongbo-phase-display {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 32px;
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.06), rgba(139, 92, 246, 0.06));
  border-radius: 16px;
  border: 1px solid rgba(59, 130, 246, 0.12);
}

.kongbo-phase-display .phase-name {
  font-size: 28px;
  font-weight: 800;
  background: linear-gradient(135deg, #60a5fa, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 12px;
}

.kongbo-phase-display .confidence-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 12px;
  background: rgba(245, 158, 11, 0.1);
  color: #f59e0b;
}

.kongbo-invest-panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.kongbo-timeline-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.kongbo-timeline-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid #1e293b;
  color: #94a3b8;
  background: rgba(15, 23, 42, 0.4);
  transition: all 0.15s ease;
}

.kongbo-timeline-tag.current {
  border-color: rgba(59, 130, 246, 0.3);
  color: #60a5fa;
  background: rgba(59, 130, 246, 0.08);
}

/* ========== Perez Specific ========== */
.perez-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

@media (max-width: 768px) {
  .perez-layout {
    grid-template-columns: 1fr;
  }
}

.perez-stage-card {
  padding: 24px;
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.06), rgba(6, 182, 212, 0.06));
  border-radius: 16px;
  border: 1px solid rgba(139, 92, 246, 0.12);
}

.perez-stage-card .stage-name {
  font-size: 22px;
  font-weight: 800;
  color: #a78bfa;
  margin-bottom: 16px;
}

.perez-signal-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.perez-signal-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.5;
}

.perez-signal-item .signal-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-top: 5px;
  flex-shrink: 0;
}

.perez-signal-item .signal-dot.financial {
  background: #f59e0b;
}

.perez-signal-item .signal-dot.real {
  background: #10b981;
}

/* ========== Evidence List ========== */
.cycle-evidence-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.cycle-evidence-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.5;
}

.cycle-evidence-item .ev-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #3b82f6;
  margin-top: 6px;
  flex-shrink: 0;
}

/* ========== Risk / Observation Lists ========== */
.cycle-risk-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.cycle-risk-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 14px;
  background: rgba(239, 68, 68, 0.03);
  border: 1px solid rgba(239, 68, 68, 0.08);
  border-radius: 8px;
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.5;
}

.cycle-risk-item .risk-icon {
  color: #ef4444;
  font-size: 14px;
  flex-shrink: 0;
}

.cycle-observation-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.cycle-observation-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 14px;
  background: rgba(59, 130, 246, 0.03);
  border: 1px solid rgba(59, 130, 246, 0.08);
  border-radius: 8px;
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.5;
}

.cycle-observation-item .obs-icon {
  color: #3b82f6;
  font-size: 14px;
  flex-shrink: 0;
}

/* ========== Phase Label Colors ========== */
.phase-bullish { color: #10b981; }
.phase-bearish { color: #ef4444; }
.phase-neutral { color: #f59e0b; }
.phase-expansion { color: #22c55e; }
.phase-peak { color: #f59e0b; }
.phase-contraction { color: #ef4444; }
.phase-trough { color: #dc2626; }

/* ========== Scroll to Top Button ========== */
.cycle-scroll-top {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: rgba(17, 24, 39, 0.9);
  border: 1px solid #334155;
  color: #94a3b8;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  z-index: 50;
  backdrop-filter: blur(8px);
}

.cycle-scroll-top:hover {
  background: rgba(30, 41, 59, 0.9);
  color: #e2e8f0;
  border-color: #475569;
}

/* ========== Historical Timeline (Kongbo) ========== */
.kongbo-history-timeline {
  display: flex;
  gap: 0;
  margin-top: 16px;
  border-radius: 8px;
  overflow: hidden;
  height: 36px;
}

.kongbo-history-segment {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.8);
  padding: 0 8px;
  position: relative;
  transition: all 0.15s ease;
  cursor: default;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.kongbo-history-segment:hover {
  filter: brightness(1.2);
}

.kongbo-history-segment.current {
  outline: 2px solid rgba(255, 255, 255, 0.3);
  outline-offset: -2px;
}

/* ========== Loading Shimmer ========== */
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.cycle-loading {
  background: linear-gradient(90deg, #111827 25%, #1e293b 50%, #111827 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
  border-radius: 8px;
  height: 100px;
}

  window.fetch = function(url, opts) {

      // Extract filename from URL (handles both relative and file:// paths)
      var parts = url.split("/");
      var filename = parts[parts.length - 1];
      if (dataMap[filename]) {
        return Promise.resolve(new Response(JSON.stringify(dataMap[filename]), { status: 200, headers: { "Content-Type": "application/json" } }));

<script>
/**
 * 宏观经济指标看板 - Main Application
 * Redesigned dashboard with professional card-based layout
 */

// ========== Configuration ==========
const CONFIG = {
  dataDir: 'data',
  chartColorUp: '#10b981',
  chartColorDown: '#ef4444',
  chartColorNeutral: '#3b82f6',
  chartGradientOpacity: 0.15,
  defaultTimeRange: '1y',
};

// ========== Utility Functions ==========
const Utils = {
  formatValue(val, unit = '') {
    if (val === null || val === undefined) return '--';
    if (typeof val === 'string') return val;
    if (Number.isInteger(val)) return val.toLocaleString();
    if (Math.abs(val) >= 1000) return val.toLocaleString(undefined, { maximumFractionDigits: 1 });
    return val.toFixed(2);
  },

  getTrendClass(change) {
    if (change === null || change === undefined) return 'change-neutral';
    return change > 0 ? 'change-up' : change < 0 ? 'change-down' : 'change-neutral';
  },

  getTrendArrow(change) {
    if (change === null || change === undefined) return '→';
    return change > 0 ? '↑' : change < 0 ? '↓' : '→';
  },

  getImpactArrow(direction) {
    if (direction === '+') return '↑';
    if (direction === '-') return '↓';
    return '→';
  },

  getImpactClass(direction) {
    if (direction === '+') return 'impact-positive';
    if (direction === '-') return 'impact-negative';
    return 'impact-neutral';
  },

  filterHistoryByRange(history, range) {
    if (!history || history.length === 0) return [];
    if (range === 'all') return history;

    const now = new Date();
    const years = range === '1y' ? 1 : range === '2y' ? 2 : 5;
    const cutoff = new Date(now.getFullYear() - years, now.getMonth(), now.getDate());

    return history.filter(item => {
      const d = this.parseDate(item.date);
      return d && d >= cutoff;
    });
  },

  parseDate(dateStr) {
    if (!dateStr) return null;
    // Handle quarterly format like "2022Q1"
    if (/^\d{4}Q\d$/.test(dateStr)) {
      const [year, q] = dateStr.split('Q');
      return new Date(parseInt(year), (parseInt(q) - 1) * 3, 1);
    }
    // Handle Chinese format like "2026年第1季度"
    if (dateStr.includes('季度')) {
      const match = dateStr.match(/(\d{4}).*?(\d)季度/);
      if (match) return new Date(parseInt(match[1]), (parseInt(match[2]) - 1) * 3, 1);
    }
    // Handle YYYY-MM
    if (/^\d{4}-\d{2}$/.test(dateStr)) {
      const [y, m] = dateStr.split('-');
      return new Date(parseInt(y), parseInt(m) - 1, 1);
    }
    // Handle YYYY-MM-DD
    const d = new Date(dateStr);
    return isNaN(d.getTime()) ? null : d;
  },

  computeChange(history) {
    if (!history || history.length < 2) return null;
    const latest = history[history.length - 1].value;
    const prev = history[history.length - 2].value;
    if (latest === null || prev === null) return null;
    return latest - prev;
  },

  signalToText(signal) {
    const map = {
      'bullish': '看多',
      'bearish': '看空',
      'neutral': '中性',
      'neutral_bullish': '中性偏多',
      'neutral_bearish': '中性偏空',
      'mixed': '分化',
      'pending': '待更新',
    };
    return map[signal] || signal;
  },

  signalToClass(signal) {
    const map = {
      'bullish': 'signal-bullish',
      'bearish': 'signal-bearish',
      'neutral': 'signal-neutral',
      'neutral_bullish': 'signal-neutral-bullish',
      'neutral_bearish': 'signal-neutral-bearish',
      'mixed': 'signal-neutral',
      'pending': 'signal-neutral',
    };
    return map[signal] || 'signal-neutral';
  },

  getPercentileClass(pctl) {
    if (pctl === null || pctl === undefined) return '';
    if (pctl >= 80) return 'pctl-high';
    if (pctl >= 40) return 'pctl-mid';
    return 'pctl-low';
  },

  escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  },
};

// ========== Chart Manager ==========
const ChartManager = {
  charts: new Map(),

  createMiniChart(containerId, data, options = {}) {
    const container = document.getElementById(containerId);
    if (!container || !data || data.length === 0) return;

    // Dispose existing chart
    if (this.charts.has(containerId)) {
      this.charts.get(containerId).dispose();
    }

    const chart = echarts.init(container);
    this.charts.set(containerId, chart);

    const dates = data.map(d => d.date);
    const values = data.map(d => d.value);
    const color = options.color || CONFIG.chartColorNeutral;
    const showArea = options.showArea !== false;

    const option = {
      animation: true,
      animationDuration: 600,
      grid: {
        top: 8,
        right: 8,
        bottom: 20,
        left: 8,
        containLabel: false,
      },
      tooltip: {
        trigger: 'axis',
        backgroundColor: '#1e293b',
        borderColor: '#334155',
        textStyle: {
          color: '#e2e8f0',
          fontSize: 11,
          fontFamily: 'JetBrains Mono',
        },
        formatter: (params) => {
          const p = params[0];
          return `<div style="font-size:10px;color:#64748b">${p.name}</div><div style="font-weight:600">${Utils.formatValue(p.value)}</div>`;
        },
      },
      xAxis: {
        type: 'category',
        data: dates,
        show: true,
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: {
          show: true,
          fontSize: 9,
          color: '#475569',
          interval: Math.max(0, Math.floor(dates.length / 4)),
          rotate: 0,
        },
        splitLine: { show: false },
      },
      yAxis: {
        type: 'value',
        show: false,
        scale: true,
      },
      series: [{
        type: 'line',
        data: values,
        smooth: 0.3,
        symbol: 'none',
        lineStyle: {
          width: 2,
          color: color,
        },
        areaStyle: showArea ? {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: color + '30' },
            { offset: 0.5, color: color + '10' },
            { offset: 1, color: color + '00' },
          ]),
        } : undefined,
      }],
    };

    chart.setOption(option);

    // Handle resize
    const observer = new ResizeObserver(() => chart.resize());
    observer.observe(container);

    return chart;
  },

  createMultiLineChart(containerId, datasets, options = {}) {
    const container = document.getElementById(containerId);

      lineStyle: { width: 2, color: ds.color },

        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: ds.color + '25' },
          { offset: 1, color: ds.color + '00' },
        ]),
      } : undefined,
    }));

    const option = {
      animation: true,
      tooltip: {
        trigger: 'axis',
        backgroundColor: '#1e293b',
        borderColor: '#334155',
        textStyle: { color: '#e2e8f0', fontSize: 11, fontFamily: 'JetBrains Mono' },
      },
      legend: {
        show: options.showLegend !== false,
        top: 0,

        icon: 'roundRect',
        itemWidth: 12,
        itemHeight: 3,
      },
      grid: { top: 36, right: 16, bottom: 24, left: 16, containLabel: true },
      xAxis: {
        type: 'time',
        axisLine: { lineStyle: { color: '#1e293b' } },
        axisLabel: { color: '#64748b', fontSize: 10 },
        splitLine: { show: false },
      },
      yAxis: {
        type: 'value',
        scale: true,
        axisLine: { show: false },
        axisLabel: { color: '#64748b', fontSize: 10 },
        splitLine: { lineStyle: { color: '#1e293b', type: 'dashed' } },
      },
      series,

    chart.setOption(option);
    const observer = new ResizeObserver(() => chart.resize());
    observer.observe(container);
    return chart;
  },

  createAreaStackChart(containerId, datasets, options = {}) {
    const container = document.getElementById(containerId);
    if (!container || !datasets || datasets.length === 0) return;

    if (this.charts.has(containerId)) {
      this.charts.get(containerId).dispose();

      };

    const option = {
      animation: true,
      tooltip: {
        trigger: 'axis',
        backgroundColor: '#1e293b',

        textStyle: { color: '#e2e8f0', fontSize: 11 },

      legend: {

        type: 'category',
        data: dates,
        axisLine: { lineStyle: { color: '#1e293b' } },
        axisLabel: { color: '#64748b', fontSize: 10, interval: Math.max(0, Math.floor(dates.length / 6)) },
        splitLine: { show: false },
      },
      yAxis: {

        scale: true,
        axisLine: { show: false },
        axisLabel: { color: '#64748b', fontSize: 10 },
        splitLine: { lineStyle: { color: '#1e293b', type: 'dashed' } },
      },
      series,
    };

    chart.setOption(option);
    const observer = new ResizeObserver(() => chart.resize());
    observer.observe(container);
    return chart;
  },

  resizeAll() {
    this.charts.forEach(chart => chart.resize());
  },

  disposeAll() {
    this.charts.forEach(chart => chart.dispose());
    this.charts.clear();
  }
};

const Components = {

  // Render section header
  sectionHeader(icon, title, desc) {
    return `
      <div class="section-header">
        <div class="section-title">${icon} ${Utils.escapeHtml(title)}</div>
        ${desc ? `<div class="section-desc">${Utils.escapeHtml(desc)}</div>` : ''}
      </div>
    `;
  },

  // Render indicator card
  indicatorCard(id, config) {
    const {
      title, date, value, unit, change, history,
      assetImpacts, signalText, sourceUrl, sourceLabel,
      chartColor, timeRanges,
    } = config;

    const trendClass = Utils.getTrendClass(change);
    const trendArrow = Utils.getTrendArrow(change);
    const changeText = change !== null && change !== undefined
      ? `${trendArrow} ${Math.abs(change).toFixed(2)}`
      : '';

    const color = chartColor || CONFIG.chartColorNeutral;
    const ranges = timeRanges || ['1y', '2y', 'all'];

    // Asset impacts HTML
    const impactsHtml = assetImpacts ? `
      <div class="asset-impact">
        <span class="asset-impact-label">资产影响</span>
        ${Object.entries(assetImpacts).map(([asset, dir]) => `
          <span class="asset-impact-item">
            <span>${asset}</span>
            <span class="impact-arrow ${Utils.getImpactClass(dir)}">${Utils.getImpactArrow(dir)}</span>
          </span>
        `).join('')}
      </div>
    ` : '';

    // Signal interpretation
    const signalHtml = signalText ? `
      <div class="signal-box">
        <div class="signal-label">💡 当前信号解读</div>
        <div class="signal-text">${Utils.escapeHtml(signalText)}</div>
      </div>
    ` : '';

    // Source link
    const sourceHtml = sourceUrl ? `
      <a href="${sourceUrl}" target="_blank" class="source-link">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
        查看来源
      </a>
    ` : '';

    return `
      <div class="indicator-card" data-card-id="${id}">
        <div class="card-header">
          <div class="card-title">${Utils.escapeHtml(title)}</div>
          <div class="card-date">${date || '--'}</div>
        </div>
        <div class="card-value-row">
          <span class="card-value" style="color: ${color}">${Utils.formatValue(value)}</span>
          ${unit ? `<span class="card-unit">${unit}</span>` : ''}
          ${changeText ? `<span class="card-change ${trendClass}">${changeText}</span>` : ''}
        </div>
        <div class="flex items-center justify-between">
          <div class="time-range-btns">
            ${ranges.map(r => `
              <button class="time-range-btn ${r === '1y' ? 'active' : ''}"
                      data-range="${r}" data-card-id="${id}"
                      onclick="app.switchTimeRange('${id}', '${r}')">
                ${r === '1y' ? '1年' : r === '2y' ? '2年' : r === '5y' ? '5年' : '全部'}
              </button>
            `).join('')}
          </div>
        </div>
        <div class="card-chart" id="chart-${id}"></div>
        ${impactsHtml}
        ${signalHtml}
        ${sourceHtml}
      </div>
    `;
  },

  // Render investment advice banner
  adviceBanner(assets, summaryData) {
    const allocation = summaryData?.allocation || {};
    const allOverweight = allocation.overweight || [];
    const allMarketWeight = allocation.market_weight || [];
    const allUnderweight = allocation.underweight || [];

    return `
      <div class="advice-banner">
        ${assets.map(asset => {
          const signal = this.getAssetSignal(asset.name, allOverweight, allMarketWeight, allUnderweight);
          return `
            <div class="advice-card">
              <div class="advice-icon">${asset.icon}</div>
              <div class="advice-asset-name">${asset.name}</div>
              <div class="advice-signal ${Utils.signalToClass(signal)}">
                ${Utils.signalToText(signal)}
              </div>
              <div class="advice-detail">${Utils.escapeHtml(asset.detail || '')}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  },

  getAssetSignal(name, overweight, marketWeight, underweight) {
    // Direct match
    if (overweight.includes(name)) return 'bullish';
    if (underweight.includes(name)) return 'bearish';
    if (marketWeight.includes(name)) return 'neutral';

    // Fuzzy mapping for common aliases
    const aliasMap = {
      'A股': ['A股', '科技成长股'],
      '中国债券': ['中国国债'],
      '美股': ['美股'],
      '美债': ['美债'],
      '商品': ['铜', '原油'],
    };

    const aliases = aliasMap[name] || [name];
    for (const alias of aliases) {
      if (overweight.includes(alias)) return 'bullish';
      if (underweight.includes(alias)) return 'bearish';
      if (marketWeight.includes(alias)) return 'neutral';
    }
    return 'neutral';
  },

  // Render valuation card
  valuationCard(id, config) {
    const { title, value, unit, percentile, percentileLabel, history, chartColor } = config;
    const color = chartColor || CONFIG.chartColorNeutral;
    const pctlClass = Utils.getPercentileClass(percentile);

    return `
      <div class="val-card" data-card-id="${id}">
        <div class="card-header">
          <div class="card-title">${Utils.escapeHtml(title)}</div>
        </div>
        <div class="val-metric" style="margin-top: 8px;">
          <span class="val-value" style="color: ${color}">${Utils.formatValue(value)}</span>
          ${unit ? `<span class="card-unit">${unit}</span>` : ''}
          ${percentile !== null && percentile !== undefined ? `
            <span class="val-percentile ${pctlClass}">
              P${percentile.toFixed(0)} ${percentileLabel || ''}
            </span>
          ` : ''}
        </div>
        <div class="card-chart" id="chart-${id}" style="margin-top: 8px;"></div>
      </div>
    `;
  },
};

  // ===== Cycle Tab =====
  renderCycle(data) {
    if (!data) return;

    const kongbo = data.kongbo || {};
    const juglar = data.juglar || {};
    const kitchin = data.kitchin || {};
    const resonance = data.resonance || {};

    let html = '';

    // Konbō Cycle

        <div class="kongbo-confidence">

        </div>
        ${kongbo.key_evidence ? `
          <div class="cycle-evidence mt-4 text-left max-w-lg mx-auto">
            ${kongbo.key_evidence.map(e => `
              <div class="evidence-item">
                <span class="evidence-dot"></span>
                <span>${Utils.escapeHtml(e)}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `;

    // Konbō History Timeline
    if (kongbo.history && kongbo.history.length) {
      html += `
        <div class="val-card mb-6">
          <div class="card-title mb-4">📜 五轮康波历史</div>
          <div class="timeline">
            ${kongbo.history.map((item, i) => `

                <div class="timeline-dot ${i === kongbo.history.length - 1 ? 'active' : ''}"></div>
                <div class="flex items-baseline gap-3">
                  <span class="text-sm font-bold text-text-primary">第${item.round}轮 · ${Utils.escapeHtml(item.name)}</span>
                  <span class="text-xs text-text-muted font-mono">${item.start} - ${item.end || '至今'}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Juglar Cycle
    html += Components.sectionHeader('🔄', '朱格拉周期（设备投资 ~8-10年）', '以企业设备投资和产能扩张为驱动的中周期');
    html += `<div class="grid-3 mb-6">`;
    ['us', 'cn', 'eu'].forEach(region => {
      const r = juglar[region] || {};
      const flag = region === 'us' ? '🇺🇸' : region === 'cn' ? '🇨🇳' : '🇪🇺';
      const name = region === 'us' ? '美国' : region === 'cn' ? '中国' : '欧洲';
      const phaseClass = r.phase_code === 'expansion' || r.phase_code === 'early_expansion' ? 'cycle-phase-bullish'
        : r.phase_code === 'late_contraction' ? 'cycle-phase-bearish' : 'cycle-phase-neutral';
      html += `
        <div class="cycle-card">
          <div class="flex items-center gap-2 mb-2">
            <span>${flag}</span>
            <span class="text-sm font-semibold text-text-primary">${name}</span>
          </div>
          <div class="cycle-phase ${phaseClass}">${Utils.escapeHtml(r.phase || '未知')}</div>
          ${r.start ? `<div class="text-xs text-text-muted mt-1">开始: ${r.start}${r.expected_end ? ` → 预计结束: ${r.expected_end}` : ''}</div>` : ''}
          ${r.expected_bottom ? `<div class="text-xs text-text-muted mt-1">预计触底: ${r.expected_bottom}</div>` : ''}
          ${r.key_driver ? `<div class="text-xs text-accent-blue mt-2">核心驱动: ${Utils.escapeHtml(r.key_driver)}</div>` : ''}
          ${r.key_issue ? `<div class="text-xs text-accent-amber mt-2">核心问题: ${Utils.escapeHtml(r.key_issue)}</div>` : ''}
          ${r.evidence ? `
            <div class="cycle-evidence">
              ${r.evidence.map(e => `
                <div class="evidence-item">
                  <span class="evidence-dot"></span>
                  <span>${Utils.escapeHtml(e)}</span>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `;
    });
    html += `</div>`;

    // Kitchin Cycle
    html += Components.sectionHeader('📦', '基钦周期（库存周期 ~3-4年）', '以企业库存变动为驱动的短周期');
    html += `<div class="grid-3 mb-6">`;
    ['us', 'cn', 'eu'].forEach(region => {
      const k = kitchin[region] || {};
      const flag = region === 'us' ? '🇺🇸' : region === 'cn' ? '🇨🇳' : '🇪🇺';
      const name = region === 'us' ? '美国' : region === 'cn' ? '中国' : '欧洲';
      const phaseClass = k.phase_code?.includes('restocking') ? 'cycle-phase-bullish'
        : k.phase_code?.includes('destocking') ? 'cycle-phase-bearish' : 'cycle-phase-neutral';
      html += `
        <div class="cycle-card">
          <div class="flex items-center gap-2 mb-2">
            <span>${flag}</span>
            <span class="text-sm font-semibold text-text-primary">${name}</span>
          </div>
          <div class="cycle-phase ${phaseClass}">${Utils.escapeHtml(k.phase || '未知')}</div>
          ${k.detail ? `<div class="text-xs text-text-secondary mt-2">${Utils.escapeHtml(k.detail)}</div>` : ''}
          ${k.risk ? `<div class="text-xs text-accent-amber mt-2">⚠️ ${Utils.escapeHtml(k.risk)}</div>` : ''}
          ${k.evidence ? `
            <div class="cycle-evidence">
              ${k.evidence.map(e => `
                <div class="evidence-item">
                  <span class="evidence-dot"></span>
                  <span>${Utils.escapeHtml(e)}</span>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `;
    });
    html += `</div>`;

    // Resonance Summary
    html += Components.sectionHeader('🎯', '三周期共振总结', '三大周期叠加形成的综合判断');
    html += `<div class="resonance-card">`;

    if (resonance.matrix) {
      html += `<div class="grid-3 mb-4">`;
      ['us', 'cn', 'eu'].forEach(region => {
        const m = resonance.matrix[region] || {};
        const flag = region === 'us' ? '🇺🇸' : region === 'cn' ? '🇨🇳' : '🇪🇺';
        const name = region === 'us' ? '美国' : region === 'cn' ? '中国' : '欧洲';

          <div class="p-3 rounded-lg" style="background: rgba(255,255,255,0.02);">

            <div class="text-xs text-text-secondary space-y-1">
              <div>康波: <span class="text-text-primary">${Utils.escapeHtml(m.kongbo || '')}</span></div>

              <div>基钦: <span class="text-text-primary">${Utils.escapeHtml(m.kitchin || '')}</span></div>
            </div>
            <div class="text-xs mt-2 text-accent-cyan font-medium">${Utils.escapeHtml(m.combined || '')}</div>
          </div>
        `;
      });
      html += `</div>`;
    }

    if (resonance.overall_regime) {
      html += `
        <div class="text-center py-3 border-t border-border-subtle">
          <div class="text-xs text-text-muted mb-1">总体格局</div>
          <div class="text-base font-bold text-text-primary">${Utils.escapeHtml(resonance.overall_regime)}</div>
          ${resonance.key_window ? `<div class="text-xs text-accent-amber mt-1">🔑 ${Utils.escapeHtml(resonance.key_window)}</div>` : ''}
        </div>
      `;
    }

    // Bull/Bear signals
    if (resonance.bull_signals || resonance.bear_signals) {
      html += `<div class="grid grid-cols-2 gap-4 mt-4">`;
      if (resonance.bull_signals) {
        html += `
          <div>
            <div class="text-xs font-semibold text-accent-green mb-2">🐂 看多确认信号</div>
            <div class="space-y-1">
              ${resonance.bull_signals.map(s => `<div class="text-xs text-text-secondary flex items-start gap-1"><span class="text-accent-green">✓</span>${Utils.escapeHtml(s)}</div>`).join('')}
            </div>
          </div>
        `;
      }
      if (resonance.bear_signals) {
        html += `
          <div>
            <div class="text-xs font-semibold text-accent-red mb-2">🐻 看空警示信号</div>
            <div class="space-y-1">
              ${resonance.bear_signals.map(s => `<div class="text-xs text-text-secondary flex items-start gap-1"><span class="text-accent-red">✗</span>${Utils.escapeHtml(s)}</div>`).join('')}
            </div>
          </div>
        `;
      }
      html += `</div>`;
    }

    // Asset implications
    if (resonance.asset_implication) {
      html += `
        <div class="mt-4 pt-4 border-t border-border-subtle">
          <div class="text-xs font-semibold text-text-secondary mb-2">💡 资产含义</div>

              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    html += `</div>`;

    document.getElementById('cycle-content').innerHTML = html;
  },

          <div class="risk-item">
            <span class="risk-icon">⚠</span>
            <span>${Utils.escapeHtml(risk)}</span>
          </div>
        `;
      });
      html += `</div>`;
    }

    document.getElementById('allocation-content').innerHTML = html;

    // Render charts
    requestAnimationFrame(() => {
      this.renderAllocationCharts(valData, priceData);
    });
  },

  renderAllocationCharts(valData, priceData) {
    // HS300 PE chart
    const hs300PeHist = valData?.cn_stock?.hs300_pe?.history || [];
    if (hs300PeHist.length > 0) {
      ChartManager.createMiniChart('chart-val-hs300pe', hs300PeHist, { color: '#06b6d4' });
    }

    // Multi-asset chart
    const prices = priceData?.prices || {};
    const datasets = [];

    if (prices.sp500?.daily?.length) {
      // Normalize to 100 base
      const baseVal = prices.sp500.daily[0].value;
      datasets.push({
        name: 'S&P 500',
        data: prices.sp500.daily.map(d => ({ date: d.date, value: (d.value / baseVal * 100) })),
        color: '#10b981',
      });
    }

    if (prices.us_10y_bond?.daily?.length) {
      datasets.push({
        name: 'US 10Y Bond',
        data: prices.us_10y_bond.daily.map(d => ({ date: d.date, value: d.value })),
        color: '#3b82f6',
      });
    }

    if (datasets.length > 0) {
      ChartManager.createMultiLineChart('chart-multi-asset', datasets, { showLegend: true });
    }
  },

  // ===== Helper: Render mini chart with time range switching =====
  renderMiniChartsForContainer(cardId, fullHistory, currentRange = '1y') {
    const containerId = `chart-${cardId}`;
    const container = document.getElementById(containerId);
    if (!container || !fullHistory || fullHistory.length === 0) return;

    const filtered = Utils.filterHistoryByRange(fullHistory, currentRange);
    if (filtered.length === 0) return;

    // Determine color based on trend
    const lastVal = filtered[filtered.length - 1].value;
    const firstVal = filtered[0].value;
    const isUp = lastVal >= firstVal;
    const color = isUp ? CONFIG.chartColorUp : CONFIG.chartColorDown;

    ChartManager.createMiniChart(containerId, filtered, { color, showArea: true });
  },
};

// ========== Main Application ==========
const app = {
  data: {
    cnMacro: null,
    usMacro: null,
    cyclePosition: null,
    assetValuation: null,
    assetPrices: null,
    dashboardSummary: null,
  },
  currentTab: 'china',

  async init() {
    try {
      await this.loadAllData();
      this.renderAll();
      this.hideLoading();
    } catch (err) {
      console.error('Init error:', err);
      this.hideLoading();
    }
  },

  async loadAllData() {
    const files = [
      ['cnMacro', 'cn_macro.json'],
      ['usMacro', 'us_macro.json'],
      ['cyclePosition', 'cycle_position.json'],
      ['assetValuation', 'asset_valuation.json'],
      ['assetPrices', 'asset_prices.json'],
      ['dashboardSummary', 'dashboard_summary.json'],
    ];

    const results = await Promise.allSettled(
      files.map(([, filename]) =>
        fetch(`${CONFIG.dataDir}/${filename}`).then(r => {
          if (!r.ok) throw new Error(`Failed to load ${filename}`);
          return r.json();
        })
      )
    );

    results.forEach((result, i) => {
      if (result.status === 'fulfilled') {
        this.data[files[i][0]] = result.value;
      } else {
        console.warn(`Failed to load ${files[i][1]}:`, result.reason);
      }
    });
  },

  renderAll() {
    // Update time
    const updateTimes = [
      this.data.cnMacro?.update_time,
      this.data.usMacro?.update_time,
      this.data.dashboardSummary?.update_time,
    ].filter(Boolean);
    if (updateTimes.length > 0) {
      document.getElementById('update-time').textContent = `更新于 ${updateTimes[0]}`;
    }

    // Render current tab
    this.renderTab(this.currentTab);
  },

  renderTab(tab) {
    switch (tab) {
      case 'china':
        TabRenderers.renderChina(this.data.cnMacro, this.data.dashboardSummary);
        break;
      case 'us':
        TabRenderers.renderUS(this.data.usMacro, this.data.dashboardSummary);
        break;
      case 'cycle':
        TabRenderers.renderCycle(this.data.cyclePosition);
        break;
      case 'allocation':
        TabRenderers.renderAllocation(this.data.assetValuation, this.data.assetPrices, this.data.dashboardSummary);
        break;
    }
  },

  switchTab(tab) {
    if (tab === this.currentTab) return;
    this.currentTab = tab;

    // Update tab buttons
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });

    // Update tab content
    document.querySelectorAll('.tab-content').forEach(content => {
      content.classList.toggle('active', content.id === `tab-${tab}`);
      content.classList.toggle('hidden', content.id !== `tab-${tab}`);
    });

    // Dispose old charts and render new tab
    ChartManager.disposeAll();
    this.renderTab(tab);
  },

  switchTimeRange(cardId, range) {
    // Update button states
    const card = document.querySelector(`[data-card-id="${cardId}"]`);
    if (card) {
      card.querySelectorAll('.time-range-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.range === range);
      });
    }

    // Re-render the chart with filtered data
    let fullHistory = null;
    const data = this.data;

    // Find the correct history data for this card
    const historyMap = {
      // China
      'cn-pmi': data.cnMacro?.history?.pmi,
      'cn-social-fin': [],
      'cn-hs300-pe': data.cnMacro?.history?.hs300_pe,
      'cn-gdp': data.cnMacro?.history?.gdp_growth,
      'cn-sse': data.cnMacro?.history?.sse_index,
      'cn-hs300-idx': data.cnMacro?.history?.hs300_index,
      'cn-cpi': data.cnMacro?.history?.cpi_yoy,
      'cn-ppi': data.cnMacro?.history?.ppi_yoy,
      'cn-10y-bond': data.cnMacro?.history?.cn_10y_bond,
      'cn-val-hs300pe': data.cnMacro?.history?.hs300_pe,
      // US
      'us-oecd': data.usMacro?.history?.oecd_cli,
      'us-yield-spread': data.usMacro?.history?.yield_spread_10y_2y,
      'us-ism-pmi': data.usMacro?.history?.ism_pmi,
      'us-gdp': data.usMacro?.history?.gdp_growth,
      'us-unemp': data.usMacro?.history?.unemployment,
      'us-sp500': data.usMacro?.history?.sp500,
      'us-cpi': data.usMacro?.history?.cpi_yoy,
      'us-ppi': data.usMacro?.history?.ppi_yoy,
      'us-fed-rate': data.usMacro?.history?.fed_funds,
    };

    fullHistory = historyMap[cardId] || [];
    if (fullHistory && fullHistory.length > 0) {
      TabRenderers.renderMiniChartsForContainer(cardId, fullHistory, range);
    }
  },

  async refresh() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('refreshing');

    ChartManager.disposeAll();
    await this.loadAllData();
    this.renderTab(this.currentTab);

    // Update time display
    const updateTimes = [
      this.data.cnMacro?.update_time,
      this.data.usMacro?.update_time,
    ].filter(Boolean);
    if (updateTimes.length > 0) {
      document.getElementById('update-time').textContent = `更新于 ${updateTimes[0]}`;
    }

    setTimeout(() => btn.classList.remove('refreshing'), 1000);
  },

  hideLoading() {
    const overlay = document.getElementById('loading-overlay');
    if (overlay) {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 0.4s ease';
      setTimeout(() => overlay.style.display = 'none', 400);
    }
  },
};

// Handle window resize
window.addEventListener('resize', () => {
  ChartManager.resizeAll();
});

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  app.init();
});

</script>
<script>
/**
 * cycle_v2.js - 宏观经济周期看板 V2 渲染模块
 * 替换原有 cycle.js，提供更丰富的可视化效果
 * 
 * 数据结构: cycle_position_v2.json
 */

const CycleV2Module = (() => {
  let chartInstances = [];
  let resizeObserver = null;

  // ========== Color Constants ==========
  const COLORS = {
    bullish: '#10b981',
    bearish: '#ef4444',
    neutral: '#f59e0b',
    blue: '#3b82f6',
    purple: '#8b5cf6',
    cyan: '#06b6d4',
    textPrimary: '#e2e8f0',
    textSecondary: '#94a3b8',
    textMuted: '#64748b',
    bgCard: '#111827',
    borderSubtle: '#1e293b',
    tooltipBg: '#1e293b',
    tooltipBorder: '#334155',
  };

  // ========== Common ECharts Tooltip ==========
  function tooltipConfig() {
    return {
      backgroundColor: COLORS.tooltipBg,
      borderColor: COLORS.tooltipBorder,
      borderWidth: 1,
      textStyle: { color: COLORS.textPrimary, fontSize: 12, fontFamily: 'JetBrains Mono' },
      padding: [8, 12],
    };
  }

  // ========== Common ECharts Grid ==========
  function gridConfig(extra = {}) {
    return Object.assign({ top: 36, right: 16, bottom: 28, left: 16, containLabel: true }, extra);
  }

  // ========== Chart Utilities ==========
  function createChart(containerId, option) {
    const container = document.getElementById(containerId);
    if (!container) return null;
    const chart = echarts.init(container, null, { renderer: 'canvas' });
    chart.setOption(option);
    chartInstances.push(chart);
    return chart;
  }

  function disposeAll() {
    chartInstances.forEach(c => { try { c.dispose(); } catch(e) {} });
    chartInstances = [];
    if (resizeObserver) {
      resizeObserver.disconnect();
      resizeObserver = null;
    }
  }

  function setupResizeObserver() {
    if (resizeObserver) resizeObserver.disconnect();
    resizeObserver = new ResizeObserver(() => {
      chartInstances.forEach(c => { try { c.resize(); } catch(e) {} });
    });
    chartInstances.forEach(c => {
      if (c.getDom()) resizeObserver.observe(c.getDom());
    });
  }

  // ========== Signal Helpers ==========
  function signalToText(signal) {
    const map = { bullish: '看多', bearish: '看空', neutral: '中性', neutral_bullish: '中性偏多', neutral_bearish: '中性偏空', mixed: '分化', pending: '待更新' };
    return map[signal] || signal || '--';
  }

  function signalToColor(signal) {
    if (!signal) return COLORS.neutral;
    if (signal === 'bullish' || signal === 'neutral_bullish') return COLORS.bullish;
    if (signal === 'bearish' || signal === 'neutral_bearish') return COLORS.bearish;
    return COLORS.neutral;
  }

  function signalToClass(signal) {
    if (!signal) return 'neutral';
    if (signal === 'bullish') return 'bullish';
    if (signal === 'bearish') return 'bearish';
    return 'neutral';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ========== Section 0: Overview ==========
  function renderOverviewHTML(data) {
    const summary = data?.synthesis?.cycle_positions_summary || [];
    if (!summary.length) return '';

    let cards = '';
    summary.forEach(item => {
      const sigClass = signalToClass(item.signal);
      const sigColor = signalToColor(item.signal);
      cards += `
        <div class="cycle-overview-card signal-${sigClass}">
          <div class="cycle-name">${escapeHtml(item.name || item.cycle || '')}</div>
          <div class="cycle-position" style="color:${sigColor}">${escapeHtml(item.position || item.phase || '--')}</div>
          <div class="cycle-signal ${sigClass}">${signalToText(item.signal)}</div>
        </div>`;
    });

    return `
      <div class="cycle-section" id="section-overview">
        <div class="cycle-section-title">
          <span class="section-icon">🎯</span>
          <h2>综合速览</h2>
          <span class="section-desc">九大周期维度当前位置与信号</span>
        </div>
        <div class="cycle-overview-grid">${cards}</div>
      </div>`;
  }

  // ========== Section 1: Unified Timeline ==========
  function renderTimelineHTML(data) {
    return `
      <div class="cycle-section" id="section-timeline">
        <div class="cycle-section-title">
          <span class="section-icon">📅</span>
          <h2>统一时间轴</h2>
          <span class="section-desc">1991-2026 多周期叠加视图</span>
        </div>
        <div class="cycle-timeline-container" id="chart-timeline"></div>
      </div>`;
  }

  function renderTimelineChart(data) {
    const timeline = data?.unified_timeline;
    if (!timeline || !timeline.cycles) return;

    const cycles = timeline.cycles;
    const categories = cycles.map(c => c.name).reverse();

    // Build data items for custom series (gantt bars)
    const ganttData = [];
    const colorMap = {
      '扩张': COLORS.bullish, '回升': COLORS.bullish, '复苏': '#22c55e',
      '衰退': COLORS.bearish, '收缩': COLORS.bearish, '萧条': '#dc2626',
      '高峰': COLORS.neutral, '峰值': COLORS.neutral,
      '谷底': '#a78bfa', '触底': '#a78bfa',
      '繁荣': '#22c55e', '安装期': COLORS.purple, '协同期': COLORS.cyan,
      '破裂期': COLORS.bearish, '酝酿期': '#6366f1',
    };

    cycles.forEach((cycle, ci) => {
      if (cycle.phases) {
        cycle.phases.forEach(phase => {
          const start = typeof phase.start === 'number' ? phase.start : new Date(phase.start).getFullYear();
          const end = typeof phase.end === 'number' ? phase.end : (phase.end ? new Date(phase.end).getFullYear() : 2026);
          // Use explicit color from data first, then fallback to colorMap
          const color = phase.color || colorMap[phase.name] || colorMap[phase.phase] || COLORS.blue;
          ganttData.push({
            value: [ci, start, end, phase.name || phase.phase],
            itemStyle: { color: color, opacity: 0.8 }
          });
        });
      }
    });

    const option = {
      tooltip: Object.assign(tooltipConfig(), {
        formatter: function(params) {
          const d = params.data;
          if (!d || !d.value) return '';
          const catIdx = categories.length - 1 - d.value[0];
          const catName = cycles[catIdx]?.name || '';
          return `<div style="font-size:11px;color:#64748b">${catName}</div>
                  <div style="font-weight:600;color:#e2e8f0;margin-top:4px">${d.value[3]}</div>
                  <div style="font-size:11px;color:#94a3b8;margin-top:2px">${d.value[1]} - ${d.value[2]}</div>`;
        }
      }),
      grid: { top: 20, right: 30, bottom: 40, left: 120 },
      xAxis: {
        type: 'value',
        min: 1991,
        max: 2026,
        axisLine: { lineStyle: { color: COLORS.borderSubtle } },
        axisLabel: { color: COLORS.textMuted, fontSize: 11, formatter: '{value}' },
        splitLine: { lineStyle: { color: 'rgba(30,41,59,0.5)', type: 'dashed' } },
      },
      yAxis: {
        type: 'category',
        data: categories,
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: { color: COLORS.textSecondary, fontSize: 12, fontWeight: 600 },
      },
      series: [
        {
          type: 'custom',
          renderItem: function(params, api) {
            const catIdx = api.value(0);
            const start = api.coord([api.value(1), catIdx]);
            const end = api.coord([api.value(2), catIdx]);
            const height = api.size([0, 1])[1] * 0.5;
            const rectShape = echarts.graphic.clipRectByRect({
              x: start[0],
              y: start[1] - height / 2,
              width: end[0] - start[0],
              height: height,
            }, { x: params.coordSys.x, y: params.coordSys.y, width: params.coordSys.width, height: params.coordSys.height });
            return rectShape && {
              type: 'rect',
              transition: ['shape'],
              shape: rectShape,
              style: api.style(),
            };
          },
          encode: { x: [1, 2], y: 0 },
          data: ganttData,
        },
        // Current time marker
        {
          type: 'line',
          markLine: {
            silent: true,
            symbol: 'none',
            lineStyle: { color: COLORS.bearish, width: 2, type: 'solid' },
            label: { show: true, formatter: '2026', color: COLORS.bearish, fontSize: 11, position: 'start' },
            data: [{ xAxis: 2026 }]
          },
          data: []
        }
      ]
    };

    createChart('chart-timeline', option);
  }

  // ========== Section 2: Kongbo (Kondratieff Wave) ==========
  function renderKongboHTML(data) {
    const kb = data?.kongbo;
    if (!kb) return '';

    const phaseName = kb.current_phase || kb.phase || '数据待更新';
    const confidence = kb.confidence || 'medium';
    const confMap = { high: '高', medium: '中', low: '低' };
    const usage = kb.investment_usage || kb.usage || '';
    const advice = kb.investment_advice || kb.advice || [];

    // History timeline
    const history = kb.history || [];
    let historyTags = '';
    history.forEach(h => {
      const isCurrent = !h.end || h.current;
      const endStr = h.end || '至今';
      historyTags += `<span class="kongbo-timeline-tag ${isCurrent ? 'current' : ''}">
        第${h.round || '?'}轮 ${h.name || h.phase || ''} (${h.start || '?'}-${endStr})
      </span>`;
    });

    // Indicators
    const indicators = kb.indicators || {};
    let indicatorCards = '';
    const indicatorList = [
      { key: 'tfp_growth', name: 'TFP增速（中美对比）', color: COLORS.blue },
      { key: 'gdp_10y_avg', name: 'GDP 10年均速（中美对比）', color: COLORS.purple },
      { key: 'capital_deepening', name: '资本深化（中美对比）', color: COLORS.cyan },
    ];

    indicatorList.forEach(ind => {
      const indData = indicators[ind.key];
      indicatorCards += `
        <div class="cycle-indicator-card">
          <div class="indicator-title">${ind.name}</div>
          <div class="indicator-chart" id="chart-kongbo-${ind.key}"></div>
        </div>`;
    });

    // Evidence
    const evidence = kb.key_evidence || kb.evidence || [];
    let evidenceHTML = '';
    if (evidence.length) {
      evidenceHTML = '<div class="cycle-evidence-list mt-4">' +
        evidence.map(e => `<div class="cycle-evidence-item"><span class="ev-dot"></span><span>${escapeHtml(e)}</span></div>`).join('') +
        '</div>';
    }

    return `
      <div class="cycle-section" id="section-kongbo">
        <div class="cycle-section-title">
          <span class="section-icon">🌊</span>
          <h2>康德拉季耶夫长波</h2>
          <span class="section-desc">~50-60年技术创新周期</span>
        </div>
        <div class="kongbo-layout">
          <div class="kongbo-phase-display">
            <div class="phase-name">${escapeHtml(phaseName)}</div>
            <span class="confidence-badge">置信度: ${confMap[confidence] || confidence}</span>
            ${evidenceHTML}
          </div>
          <div class="kongbo-invest-panel">
            ${usage ? `<div class="cycle-advice-box">
              <div class="advice-title">💡 投资用途</div>
              <p style="font-size:12px;color:#94a3b8;line-height:1.6">${escapeHtml(usage)}</p>
            </div>` : ''}
            ${advice.length ? `<div class="cycle-advice-box">
              <div class="advice-title">📋 投资建议</div>
              <ul class="advice-list">${advice.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul>
            </div>` : ''}
          </div>
        </div>
        <div class="cycle-indicator-grid">${indicatorCards}</div>
        ${history.length ? `<div style="margin-top:20px">
          <div style="font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:8px">📜 历史康波周期</div>
          <div class="kongbo-timeline-bar">${historyTags}</div>
        </div>` : ''}
      </div>`;
  }

  function renderKongboCharts(data) {
    const kb = data?.kongbo;
    if (!kb) return;
    const indicators = kb.indicators || {};

    const indicatorConfigs = [
      { key: 'tfp_growth', series: ['us', 'cn'], names: ['美国TFP', '中国TFP'], colors: [COLORS.blue, COLORS.bearish] },
      { key: 'gdp_10y_avg', series: ['us', 'cn'], names: ['美国GDP', '中国GDP'], colors: [COLORS.blue, COLORS.bearish] },
      { key: 'capital_deepening', series: ['us', 'cn'], names: ['美国资本深化', '中国资本深化'], colors: [COLORS.blue, COLORS.bearish] },
    ];

    indicatorConfigs.forEach(cfg => {
      const indData = indicators[cfg.key];
      if (!indData) return;

      const seriesData = [];
      cfg.series.forEach((region, i) => {
        const regionObj = indData[region] || indData[cfg.names[i]] || null;
        if (!regionObj) return;
        // Handle both {history: [{date, value}]} and raw array formats
        const regionData = regionObj.history || (Array.isArray(regionObj) ? regionObj : null);
        if (regionData && regionData.length) {
          seriesData.push({
            name: cfg.names[i],
            type: 'line',
            data: regionData.map(d => [d.date || d.year || d.x, d.value || d.y]),
            smooth: 0.3,
            symbol: 'none',
            lineStyle: { width: 2, color: cfg.colors[i] },
            areaStyle: {
              color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: cfg.colors[i] + '25' },
                { offset: 1, color: cfg.colors[i] + '00' },
              ])
            },
          });
        }
      });

      if (seriesData.length) {
        createChart(`chart-kongbo-${cfg.key}`, {
          tooltip: Object.assign(tooltipConfig(), { trigger: 'axis' }),
          legend: { show: true, top: 0, textStyle: { color: COLORS.textSecondary, fontSize: 10 }, icon: 'roundRect', itemWidth: 12, itemHeight: 3 },
          grid: gridConfig({ top: 32 }),
          xAxis: { type: 'time', axisLine: { lineStyle: { color: COLORS.borderSubtle } }, axisLabel: { color: COLORS.textMuted, fontSize: 10 }, splitLine: { show: false } },
          yAxis: { type: 'value', scale: true, axisLine: { show: false }, axisLabel: { color: COLORS.textMuted, fontSize: 10 }, splitLine: { lineStyle: { color: 'rgba(30,41,59,0.4)', type: 'dashed' } } },
          series: seriesData,
        });
      }
    });
  }

  // ========== Section 3: Perez (Technological Revolution) ==========
  function renderPerezHTML(data) {
    const pz = data?.perez;
    if (!pz) return '';

    const stageName = pz.current_stage || pz.phase || '数据待更新';
    const usage = pz.investment_usage || pz.usage || '';
    const advice = pz.investment_advice || pz.advice || [];
    const financialSignals = pz.financial_signals || pz.financial_indicators || [];
    const realSignals = pz.real_signals || pz.real_indicators || [];
    const indicators = pz.indicators || {};

    let signalItems = '';
    financialSignals.forEach(s => {
      signalItems += `<div class="perez-signal-item"><span class="signal-dot financial"></span><span>${escapeHtml(s)}</span></div>`;
    });
    realSignals.forEach(s => {
      signalItems += `<div class="perez-signal-item"><span class="signal-dot real"></span><span>${escapeHtml(s)}</span></div>`;
    });

    // Indicator cards
    const indicatorDefs = [

      '滞胀': [-0.5, 0.5], 'stagflation': [-0.5, 0.5],
      '衰退': [-0.5, -0.5], 'recession': [-0.5, -0.5],
    };

    ['us', 'cn'].forEach(region => {
      const d = mc[region];

      const qColors = [COLORS.bullish, COLORS.neutral, COLORS.bearish, COLORS.blue];

      const qAreas = [
        { x: 0, y: 0, width: 1, height: 1 },  // top-right: 复苏
        { x: 0, y: 0, width: 1, height: 1 },  // top-left: 过热 (will be mapped differently)

      createChart(`chart-merrill-${region}`, {

        grid: { top: 30, right: 30, bottom: 30, left: 40 },
        xAxis: {
          type: 'value', min: -1, max: 1,

    renderLineChart('chart-credit-us-bank-credit', usIndicators.bank_credit || usIndicators.bank_credit_growth, COLORS.bullish);
  }

  // ========== Section 8: Synthesis ==========
  function renderSynthesisHTML(data) {
    const synthesis = data?.synthesis;
    if (!synthesis) return '';

    const assets = synthesis.asset_views || synthesis.assets || [];
    const risks = synthesis.key_risks || synthesis.risks || [];
    const observations = synthesis.key_observations || synthesis.observations || [];

    // Asset view cards
    const assetIcons = {
      'A股': '🇨🇳📈', '美股': '🇺🇸📈', '中国利率债': '🏦', '美国国债': '🏛️',

    };

    let assetCards = '';
    assets.forEach(asset => {
      const name = asset.name || asset.asset || '';
      const allocation = asset.allocation || asset.view || '标配';
      const allocClass = allocation.includes('超配') ? 'overweight' : allocation.includes('低配') ? 'underweight' : 'market-weight';
      const reason = asset.reason || asset.rationale || '';
      const icon = assetIcons[name] || '📊';

      assetCards += `
        <div class="asset-view-card ${allocClass}">
          <div class="asset-icon">${icon}</div>
          <div class="asset-name">${escapeHtml(name)}</div>
          <div class="asset-allocation ${allocClass}">${escapeHtml(allocation)}</div>
          <div class="asset-reason">${escapeHtml(reason)}</div>
        </div>`;
    });

    // Risks
    let risksHTML = '';
    if (risks.length) {
      risksHTML = `<div style="margin-top:24px">
        <div style="font-size:14px;font-weight:700;color:#ef4444;margin-bottom:12px;display:flex;align-items:center;gap:6px">⚠️ 关键风险</div>
        <div class="cycle-risk-list">${risks.map(r => `
          <div class="cycle-risk-item">
            <span class="risk-icon">⚠</span>
            <span>${escapeHtml(r.text || r)}</span>
          </div>`).join('')}
        </div>
      </div>`;
    }

    // Observations
    let obsHTML = '';
    if (observations.length) {
      obsHTML = `<div style="margin-top:20px">
        <div style="font-size:14px;font-weight:700;color:#3b82f6;margin-bottom:12px;display:flex;align-items:center;gap:6px">🔍 关键观察点</div>
        <div class="cycle-observation-list">${observations.map(o => `
          <div class="cycle-observation-item">
            <span class="obs-icon">🔍</span>
            <span>${escapeHtml(o.text || o)}</span>
          </div>`).join('')}
        </div>

    }

    return `
      <div class="cycle-section" id="section-synthesis">
        <div class="cycle-section-title">
          <span class="section-icon">🎯</span>
          <h2>综合结论</h2>

        </div>
        <div class="cycle-asset-grid">${assetCards}</div>
        ${risksHTML}

  }

  // ========== Main Render ==========
  function render(data) {
    const container = document.getElementById('cycle-content');
    if (!container || !data) return;

    let html = '';
    html += renderOverviewHTML(data);
    html += renderTimelineHTML(data);
    html += renderKongboHTML(data);
    html += renderPerezHTML(data);
    html += renderJuglarHTML(data);
    html += renderKitchinHTML(data);
    html += renderMerrillClockHTML(data);
    html += renderCreditImpulseHTML(data);
    html += renderSynthesisHTML(data);

    container.innerHTML = html;

    // Render charts after DOM is ready
    requestAnimationFrame(() => {
      renderTimelineChart(data);
      renderKongboCharts(data);
      renderPerezCharts(data);
      renderJuglarCharts(data);
      renderKitchinCharts(data);
      renderMerrillClockCharts(data);
      renderCreditImpulseCharts(data);
      // Setup resize observer after all charts created
      setupResizeObserver();
    });
  }

  return { render, dispose: disposeAll };
})();
